<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage Trend</title>
<style>
  :root {
    --bg:      #f9f9f7;
    --surface: #fcfcfb;
    --text:    #0b0b0b;
    --muted:   #6b6a66;
    --grid:    #e1e0d9;
    --line:    #2a78d6;
    --good:    #006300;
    --bad:     #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #0d0d0d;
      --surface: #1a1a19;
      --text:    #ffffff;
      --muted:   #a7a59d;
      --grid:    #2c2c2a;
      --line:    #3987e5;
      --good:    #0ca30c;
      --bad:     #e66767;
    }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px;
  }

  .hero {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
    margin-bottom: 16px;
  }

  .hero-value {
    font-size: 44px;
    font-weight: 600;
    line-height: 1;
  }

  .hero-delta { font-size: 14px; font-weight: 600; }
  .hero-delta.up { color: var(--good); }
  .hero-delta.down { color: var(--bad); }
  .hero-delta.flat { color: var(--muted); }

  .hero-meta {
    flex-basis: 100%;
    color: var(--muted);
    font-size: 13px;
  }

  .chart-wrap { overflow-x: auto; }

  svg {
    display: block;
    min-width: 480px;
    width: 100%;
    height: auto;
  }

  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { fill: var(--muted); font-size: 11px; }

  .line {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .dot { fill: var(--line); stroke: var(--surface); stroke-width: 2; }

  .muted { color: var(--muted); font-size: 14px; }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    margin-top: 16px;
  }

  th, td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--grid);
  }

  th { color: var(--muted); font-weight: 500; }

  summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    margin-top: 16px;
  }

  footer {
    margin-top: 20px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="page">
  <h1>Test Coverage Trend &mdash; main</h1>
  <p class="subtitle">Line coverage (JaCoCo) on every push to <code>main</code>.</p>

  <div class="card" id="content">
    <p class="muted">Loading&hellip;</p>
  </div>

  <footer>Data source: <code>coverage-history.csv</code>, appended by CI after each merge to <code>main</code>.</footer>
</div>

<script>
(function () {
  "use strict";

  function parseCsv(text) {
    return text.split(/\r?\n/)
      .slice(1)
      .filter(function (l) { return l.trim(); })
      .map(function (l) {
        var p = l.split(",");
        return { date: p[0].trim(), commit: (p[1] || "").trim(), coverage: parseFloat(p[2]) };
      })
      .filter(function (r) { return r.date && !isNaN(r.coverage); });
  }

  function pct(v) { return v.toFixed(1) + "%"; }

  function render(rows) {
    var content = document.getElementById("content");
    content.textContent = "";

    if (rows.length === 0) {
      content.innerHTML = '<p class="muted">No coverage history yet. It will appear after the next push to main.</p>';
      return;
    }

    var latest = rows[rows.length - 1];
    var prev = rows.length > 1 ? rows[rows.length - 2] : null;

    var hero = document.createElement("div");
    hero.className = "hero";
    hero.innerHTML = '<span class="hero-value">' + pct(latest.coverage) + "</span>";

    if (prev) {
      var delta = Math.round((latest.coverage - prev.coverage) * 10) / 10;
      var cls = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
      var span = document.createElement("span");
      span.className = "hero-delta " + cls;
      span.textContent = (delta > 0 ? "+" : "") + delta.toFixed(1) + " pp vs previous";
      hero.appendChild(span);
    }

    var meta = document.createElement("span");
    meta.className = "hero-meta";
    meta.textContent = "As of " + latest.date + " · commit " + latest.commit;
    hero.appendChild(meta);
    content.appendChild(hero);

    if (rows.length > 1) content.appendChild(buildChart(rows));
    content.appendChild(buildTable(rows));
  }

  function buildChart(rows) {
    var w = 820, h = 300, m = { top: 10, right: 10, bottom: 30, left: 40 };
    var plotW = w - m.left - m.right, plotH = h - m.top - m.bottom;

    var values = rows.map(function (r) { return r.coverage; });
    var lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
    var pad = Math.max((hi - lo) * 0.2, 2);
    var yMin = Math.max(lo - pad, 0), yMax = Math.min(hi + pad, 100);

    function x(i) { return (i / (rows.length - 1)) * plotW; }
    function y(v) { return plotH - ((v - yMin) / (yMax - yMin)) * plotH; }

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    var g = document.createElementNS(svgNS, "g");
    g.setAttribute("transform", "translate(" + m.left + "," + m.top + ")");
    svg.appendChild(g);

    function el(tag, attrs) {
      var e = document.createElementNS(svgNS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    for (var i = 0; i <= 4; i++) {
      var v = yMin + (yMax - yMin) * (i / 4);
      var gy = y(v);
      g.appendChild(el("line", { class: "grid", x1: 0, x2: plotW, y1: gy, y2: gy }));
      var label = el("text", { class: "axis", x: -8, y: gy + 4, "text-anchor": "end" });
      label.textContent = Math.round(v) + "%";
      g.appendChild(label);
    }

    var maxLabels = 7;
    var stride = Math.max(1, Math.ceil(rows.length / maxLabels));
    rows.forEach(function (r, i) {
      if (i % stride !== 0 && i !== rows.length - 1) return;
      var anchor = i === 0 ? "start" : i === rows.length - 1 ? "end" : "middle";
      var label = el("text", { class: "axis", x: x(i), y: plotH + 20, "text-anchor": anchor });
      label.textContent = r.date;
      g.appendChild(label);
    });

    var d = rows.map(function (r, i) {
      return (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(r.coverage).toFixed(1);
    }).join(" ");
    g.appendChild(el("path", { class: "line", d: d }));

    rows.forEach(function (r, i) {
      var dot = el("circle", { class: "dot", cx: x(i), cy: y(r.coverage), r: 4 });
      dot.appendChild(el("title")).textContent = r.date + " · " + r.commit + " · " + pct(r.coverage);
      g.appendChild(dot);
    });

    var wrap = document.createElement("div");
    wrap.className = "chart-wrap";
    wrap.appendChild(svg);
    return wrap;
  }

  function buildTable(rows) {
    var details = document.createElement("details");
    var summary = document.createElement("summary");
    summary.textContent = "Show data as table (" + rows.length + " entries)";
    details.appendChild(summary);

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    thead.innerHTML = "<tr><th>Datum</th><th>Commit</th><th>Coverage</th></tr>";
    var tbody = document.createElement("tbody");
    rows.slice().reverse().forEach(function (r) {
      var tr = document.createElement("tr");
      [r.date, r.commit, pct(r.coverage)].forEach(function (text) {
        var td = document.createElement("td");
        td.textContent = text;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(thead);
    table.appendChild(tbody);
    details.appendChild(table);
    return details;
  }

  fetch("coverage-history.csv", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error(); return res.text(); })
    .then(function (text) { render(parseCsv(text)); })
    .catch(function () { render([]); });
})();
</script>
</body>
</html>
