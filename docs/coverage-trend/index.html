<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage Trend</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f9f9f7; color: #0b0b0b; margin: 0; }
  .page { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b6a66; font-size: 14px; margin: 0 0 24px; }
  .card { background: #fcfcfb; border: 1px solid #e1e0d9; border-radius: 12px; padding: 24px; }
  .current { font-size: 16px; margin: 0 0 16px; }
  .current strong { font-size: 32px; }
  svg { width: 100%; height: auto; display: block; }
  .line { fill: none; stroke: #2a78d6; stroke-width: 2; }
  .dot { fill: #2a78d6; }
  .axis { fill: #6b6a66; font-size: 11px; }
</style>
</head>
<body>
<div class="page">
  <h1>Test Coverage Trend &mdash; main</h1>
  <p class="sub">Line coverage (JaCoCo), updated on every push to <code>main</code>.</p>
  <div class="card" id="content">Loading&hellip;</div>
</div>

<script>
(function () {
//errors fail loudly not silently
  "use strict";

  function pct(v) { return v.toFixed(1) + "%"; }

  fetch("coverage-history.csv", { cache: "no-store" })
    .then(function (r) { return r.text(); })
    .then(function (text) {
      var rows = text.trim().split("\n").slice(1).map(function (line) {
        var p = line.split(",");
        return { date: p[0], commit: p[1], coverage: parseFloat(p[2]) };
      });

      var content = document.getElementById("content");
      content.textContent = "";

      if (rows.length === 0) {
        content.textContent = "No coverage history yet.";
        return;
      }

      var latest = rows[rows.length - 1];
      var current = document.createElement("p");
      current.className = "current";
      var strong = document.createElement("strong");
      strong.textContent = pct(latest.coverage);
      current.append("Current: ", strong, " (as of " + latest.date + ")");
      content.appendChild(current);

      if (rows.length < 2) return;

      var w = 800, h = 260, m = 30;
      var values = rows.map(function (r) { return r.coverage; });
      var lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
      var pad = Math.max((hi - lo) * 0.2, 2);
      lo = Math.max(lo - pad, 0);
      hi = Math.min(hi + pad, 100);

      function x(i) { return m + (i / (rows.length - 1)) * (w - 2 * m); }
      function y(v) { return h - m - ((v - lo) / (hi - lo)) * (h - 2 * m); }

      var svgNS = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 " + w + " " + h);

      var points = rows.map(function (r, i) { return x(i) + "," + y(r.coverage); }).join(" ");
      var polyline = document.createElementNS(svgNS, "polyline");
      polyline.setAttribute("class", "line");
      polyline.setAttribute("points", points);
      svg.appendChild(polyline);

      rows.forEach(function (r, i) {
        var dot = document.createElementNS(svgNS, "circle");
        dot.setAttribute("class", "dot");
        dot.setAttribute("cx", x(i));
        dot.setAttribute("cy", y(r.coverage));
        dot.setAttribute("r", 4);
        var title = document.createElementNS(svgNS, "title");
        title.textContent = r.date + " · " + r.commit + " · " + pct(r.coverage);
        dot.appendChild(title);
        svg.appendChild(dot);
      });

      [[hi, y(hi)], [lo, y(lo)]].forEach(function (t) {
        var label = document.createElementNS(svgNS, "text");
        label.setAttribute("class", "axis");
        label.setAttribute("x", 2);
        label.setAttribute("y", t[1] + 4);
        label.textContent = Math.round(t[0]) + "%";
        svg.appendChild(label);
      });

      [[rows[0].date, x(0), "start"], [latest.date, x(rows.length - 1), "end"]].forEach(function (t) {
        var label = document.createElementNS(svgNS, "text");
        label.setAttribute("class", "axis");
        label.setAttribute("x", t[1]);
        label.setAttribute("y", h - 8);
        label.setAttribute("text-anchor", t[2]);
        label.textContent = t[0];
        svg.appendChild(label);
      });

      content.appendChild(svg);
    })
    .catch(function () {
      document.getElementById("content").textContent = "No coverage history yet.";
    });
})();
</script>
</body>
</html>
