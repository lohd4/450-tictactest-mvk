name: Release

# A release is never created by a normal push to main - only by deliberately
# pushing a release tag (v<MAJOR>.<MINOR>.<PATCH>). See RELEASE.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to (re-)build, e.g. v1.0.0'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed to create the GitHub release and upload the jar
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_VERSION:-$REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$tag' is not a valid release tag (expected vMAJOR.MINOR.PATCH)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }} # build exactly the tagged commit
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tests run before the build: a failing test aborts the job, so no release
      # and no jar are ever published for a broken commit.
      - name: Test
        run: ./gradlew test

      - name: E2E Test
        run: ./gradlew e2eTest

      - name: Coverage verification
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification

      - name: Build executable jar
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.tag }}
        run: ./gradlew clean jar

      - name: Verify the jar actually starts
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: java -jar "build/libs/tictactest-${VERSION}.jar" --version

      - name: Package frontend
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: bash .github/scripts/package-frontend.sh "$VERSION"

      - name: Generate SHA-256 checksums
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          (cd build/libs && sha256sum "tictactest-${VERSION}.jar" > "tictactest-${VERSION}.jar.sha256")
          (cd build/frontend && sha256sum "tictactest-frontend-${VERSION}.zip" > "tictactest-frontend-${VERSION}.zip.sha256")

      - name: Extract changelog section for this version
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash .github/scripts/release-notes.sh "$VERSION" "$TAG" > release-notes.md

      - name: Create GitHub release and attach the jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TicTacTest ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            build/libs/tictactest-${{ steps.tag.outputs.version }}.jar
            build/libs/tictactest-${{ steps.tag.outputs.version }}.jar.sha256
            build/frontend/tictactest-frontend-${{ steps.tag.outputs.version }}.zip
            build/frontend/tictactest-frontend-${{ steps.tag.outputs.version }}.zip.sha256
