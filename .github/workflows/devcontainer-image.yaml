name: Dev container image

# Builds .devcontainer/Dockerfile and pushes it to GHCR as
#   ghcr.io/<owner>/tictactest-dev:<branch-slug>   (every branch)
#   ghcr.io/<owner>/tictactest-dev:latest          (default branch only)
# Only runs when the dev container definition actually changes.

on:
  push:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yaml'
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tictactest-dev
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
