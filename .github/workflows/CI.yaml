name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - develop

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick image tag
        id: pick
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/$owner/tictactest-dev"
          slug=$(echo "${{ github.head_ref || github.ref_name }}" | sed 's#[^a-zA-Z0-9._-]#-#g')
          for tag in "$slug" "${{ github.event.repository.default_branch }}" latest; do
            if docker manifest inspect "$repo:$tag" >/dev/null 2>&1; then
              echo "image=$repo:$tag" >> "$GITHUB_OUTPUT"
              echo "Using $repo:$tag"
              exit 0
            fi
          done
          echo "::error::No dev container image in GHCR yet. Run the 'Dev container image' workflow (Actions tab -> Run workflow), or push a change under .devcontainer/."
          exit 1

  build-and-test:
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew test
