name: CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches:
      - main
      - develop

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick image tag
        id: pick
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/$owner/tictactest-dev"
          slug=$(echo "${{ github.head_ref || github.ref_name }}" | sed 's#[^a-zA-Z0-9._-]#-#g')
          for tag in "$slug" "${{ github.event.repository.default_branch }}" latest; do
            if docker manifest inspect "$repo:$tag" >/dev/null 2>&1; then
              echo "image=$repo:$tag" >> "$GITHUB_OUTPUT"
              echo "Using $repo:$tag"
              exit 0
            fi
          done
          echo "::error::No dev container image in GHCR yet. Run the 'Dev container image' workflow (Actions tab -> Run workflow), or push a change under .devcontainer/."
          exit 1

  build-and-test:
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew test

      - name: Coverage report + verification
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

  coverage-trend:
    name: Publish coverage trend to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-trend-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: coverage-report

      - name: Determine current line coverage
        id: coverage
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage-report/jacocoTestReport.xml").getroot()
          for counter in root.findall("counter"):
              if counter.get("type") == "LINE":
                  covered = int(counter.get("covered"))
                  missed = int(counter.get("missed"))
                  pct = round(covered / (covered + missed) * 100, 1)
                  print(f"value={pct}")
                  break
          PYEOF

      - name: Assemble site with updated coverage history
        run: |
          set -euo pipefail
          mkdir -p site
          cp docs/coverage-trend/index.html site/index.html

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git show origin/gh-pages:coverage-history.csv > site/coverage-history.csv 2>/dev/null || echo "Datum,Commit,Coverage" > site/coverage-history.csv
          else
            echo "Datum,Commit,Coverage" > site/coverage-history.csv
          fi

          echo "$(date -u +%Y-%m-%d),${GITHUB_SHA::7},${{ steps.coverage.outputs.value }}" >> site/coverage-history.csv

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update coverage trend (${{ github.sha }})'
