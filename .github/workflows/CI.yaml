name: CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches:
      - main
      - develop

jobs:
  resolve-image:
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick image tag
        id: pick
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/resolve-image.sh

  build-and-test:
    needs: resolve-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew test

      - name: Coverage report + verification
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

  coverage-trend:
    name: Publish coverage trend to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: coverage-trend-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: coverage-report

      - name: Determine current line coverage
        id: coverage
        run: python3 .github/scripts/coverage-from-jacoco.py coverage-report/jacocoTestReport.xml >> "$GITHUB_OUTPUT"

      - name: Assemble site with updated coverage history
        env:
          COVERAGE_VALUE: ${{ steps.coverage.outputs.value }}
        run: bash .github/scripts/assemble-coverage-site.sh

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update coverage trend (${{ github.sha }})'
