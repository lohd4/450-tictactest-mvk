name: Coverage Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  resolve-image:
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick image tag
        id: pick
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/resolve-image.sh

  coverage-main:
    name: Coverage of main
    needs: resolve-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    outputs:
      value: ${{ steps.coverage.outputs.value }}
    steps:
      - name: Checkout PR branch (for .github/scripts)
        uses: actions/checkout@v5

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main-src

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        working-directory: main-src
        run: ./gradlew test

      - name: Coverage report
        working-directory: main-src
        run: ./gradlew jacocoTestReport

      - name: Determine line coverage
        id: coverage
        run: bash .github/scripts/jacoco-line-coverage.sh main-src/build/reports/jacoco/test/jacocoTestReport.xml

  coverage-branch:
    name: Coverage of branch
    needs: resolve-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    outputs:
      value: ${{ steps.coverage.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Coverage report
        run: ./gradlew jacocoTestReport

      - name: Determine line coverage
        id: coverage
        run: bash .github/scripts/jacoco-line-coverage.sh build/reports/jacoco/test/jacocoTestReport.xml

  gate:
    name: Evaluate coverage gate
    needs: [coverage-main, coverage-branch]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Compare coverage
        id: evaluate
        env:
          COVERAGE_MAIN: ${{ needs.coverage-main.outputs.value }}
          COVERAGE_BRANCH: ${{ needs.coverage-branch.outputs.value }}
        run: bash .github/scripts/compare-coverage.sh

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COVERAGE_MAIN: ${{ steps.evaluate.outputs.main }}
          COVERAGE_BRANCH: ${{ steps.evaluate.outputs.branch }}
          COVERAGE_DIFF: ${{ steps.evaluate.outputs.diff }}
          COVERAGE_RESULT: ${{ steps.evaluate.outputs.result }}
        with:
          script-path: .github/scripts/comment-coverage.js
