# Gateway in front of the web console. Mirrors the nginx config the EC2
# instance runs, so the same two concerns are solved in both places:
#
#   1. the running backend version is queryable over HTTP
#   2. ttyd's WebSocket survives the reverse proxy
server {
	listen 80;
	server_name _;

	# --- version endpoint ---------------------------------------------------
	# Plain text, exactly the version that is deployed, e.g. "1.1.0".
	# version.txt is written next to the jar at deploy time - never by hand.
	#
	# CORS is required: the frontend is served from a different origin (another
	# port locally, the S3 website bucket in the cloud), so without this header
	# the browser blocks the fetch and the page cannot show the backend version.
	location = /version {
		alias /srv/app/version.txt;
		default_type text/plain;
		add_header Access-Control-Allow-Origin "*" always;
		add_header Cache-Control "no-store" always;
	}

	# --- web console --------------------------------------------------------
	# Everything else is ttyd: the xterm.js page, /token and the /ws WebSocket.
	location / {
		proxy_pass http://console:7681;
		proxy_http_version 1.1;

		# WebSocket upgrade - without these three the terminal loads but never connects.
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# A game sits idle while the player thinks; don't cut the connection.
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
