plugins {
	id 'java'
	id 'application'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

repositories {
	mavenCentral()
}

// The git tag is the single source of truth for the release version: tag `v1.0.0`
// produces `tictactest-1.0.0.jar`. The release workflow passes the pushed tag in
// RELEASE_VERSION; locally the tag on HEAD is used. See RELEASE.md.
version = resolveReleaseVersion()

base {
	archivesName = 'tictactest' // -> build/libs/tictactest-<version>.jar
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
		vendor = JvmVendorSpec.AZUL
	}
}

application {
	mainClass = 'ch.bbw.m450.tictactoe.TicTacToeMain'
}

// Makes the jar runnable via `java -jar`. The project has no runtime dependencies,
// so the plain jar is already self-contained - no shadow/fat-jar plugin needed.
// Implementation-Version is what `java -jar tictactest-<version>.jar --version` prints.
jar {
	manifest {
		attributes(
				'Main-Class': application.mainClass.get(),
				'Implementation-Title': 'TicTacTest',
				'Implementation-Version': project.version)
	}
}

dependencies {
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testImplementation 'org.junit-pioneer:junit-pioneer:3.0.0-RC1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform {
		excludeTags 'e2e' // E2E tests run separately via the `e2eTest` task, see below
	}
	finalizedBy jacocoTestReport // always produce a coverage report after tests
}

// End-to-end tests (full game flow via real stdin/stdout, invalid/malicious input, DoS probes)
// live alongside the other tests but are tagged "e2e" and run through their own Gradle task,
// `test` is a fast unit/integration run. See doc/TESTKONZEPT.md
tasks.register('e2eTest', Test) {
	description = 'Runs the end-to-end test suite (full game flow, invalid/malicious input, DoS probes).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
}

check.dependsOn e2eTest

jacoco {
	toolVersion = '0.8.13'
}

// Intentionally excluded from this coverage gate (see doc/TESTKONZEPT.md):
def coverageExclusions = ['**/players/HumanPlayer.class']

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true   // for CI / external tools
		html.required = true  // for humans: build/reports/jacoco/test/html/index.html
		csv.required = false
	}
	classDirectories.setFrom(classDirectories.files.collect {
		fileTree(dir: it, exclude: coverageExclusions)
	})
}

jacocoTestCoverageVerification {
	dependsOn test
	classDirectories.setFrom(classDirectories.files.collect {
		fileTree(dir: it, exclude: coverageExclusions)
	})
	violationRules {
		// overall floor so coverage cannot silently regress
		// (currently ~0.83; raise as the planned TODO tests in the test concept land)
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
		// win detection is the heart of the game - nearly every branch must be hit
		rule {
			element = 'CLASS'
			includes = ['ch.bbw.m450.tictactoe.TicTacToeMain']
			limit {
				counter = 'BRANCH'
				minimum = 0.90
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification

pitest {
	pitestVersion = '1.30.0'     
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	excludedClasses = ['ch.bbw.m450.tictactoe.players.HumanPlayer']
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}

run {
	standardInput = System.in
}

/**
 * Resolves the version this build produces, in order of precedence:
 *   1. RELEASE_VERSION  - set by .github/workflows/release.yaml from the pushed tag
 *   2. the annotated git tag pointing exactly at HEAD (local release builds)
 *   3. 0.0.0-SNAPSHOT   - any ordinary development build
 * A leading "v" is stripped, so tag `v1.0.0` becomes version `1.0.0`.
 */
def resolveReleaseVersion() {
	def fromEnv = System.getenv('RELEASE_VERSION')
	if (fromEnv?.trim()) {
		return fromEnv.trim().replaceFirst(/^v/, '')
	}
	try {
		def process = new ProcessBuilder('git', 'describe', '--tags', '--exact-match')
				.directory(projectDir)
				.redirectError(ProcessBuilder.Redirect.DISCARD)
				.start()
		def tag = process.inputStream.text.trim()
		if (process.waitFor() == 0 && tag) {
			return tag.replaceFirst(/^v/, '')
		}
	} catch (Exception ignored) {
		// no git (or no tag) available -> fall through to the snapshot version
	}
	return '0.0.0-SNAPSHOT'
}
